<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>跳一跳</title>
    <style>
        /* ========== 全局样式 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        body {
            background: linear-gradient(135deg, #a8d8ea 0%, #c3aed6 100%);
            background-attachment: fixed;
        }

        /* ========== 毛玻璃 ========== */
        .glass {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 8px 32px rgba(31,38,135,0.15);
        }

        /* ========== 按钮 ========== */
        .btn {
            border-radius: 25px; padding: 12px 36px;
            font-size: 18px; font-weight: 600; color: #fff;
            border: none; cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
        .btn:active { transform: translateY(0); }

        /* ========== 欢迎页 ========== */
        #welcomePage {
            position: fixed; top:0; left:0; width:100%; height:100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100; transition: opacity 0.5s ease;
        }
        #welcomePage.hidden { opacity: 0; pointer-events: none; }
        .game-title {
            font-size: 64px; font-weight: 800; color: #fff;
            text-shadow: 2px 4px 12px rgba(0,0,0,0.2);
            margin-bottom: 20px; letter-spacing: 8px;
        }
        .game-subtitle {
            font-size: 20px; color: rgba(255,255,255,0.9);
            margin-bottom: 60px; letter-spacing: 4px;
        }
        .start-btn {
            font-size: 24px; padding: 16px 60px;
            background: rgba(255,255,255,0.35);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        }

        /* ========== 游戏主界面 ========== */
        #gamePage {
            position: fixed; top:0; left:0; width:100%; height:100%;
            display: none; z-index: 50;
        }
        #gamePage.active {
            display: flex; align-items: center; justify-content: center;
            gap: 30px; padding: 20px;
        }

        /* ========== 游戏画面区 2:3 ========== */
        .game-area-wrapper {
            position: relative; width: 300px; height: 450px;
            max-width: 40vw; max-height: 85vh;
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        @media (min-width: 768px) {
            .game-area-wrapper { width: 360px; height: 540px; }
        }
        @media (min-width: 1200px) {
            .game-area-wrapper { width: 400px; height: 600px; }
        }
        #gameCanvas { display: block; width: 100%; height: 100%; }

        /* ========== 排行榜 ========== */
        .leaderboard-container {
            width: 220px; display: flex; flex-direction: column;
            border-radius: 20px; overflow: hidden; flex-shrink: 0;
        }
        .leaderboard-header {
            padding: 16px 20px; display: flex;
            align-items: center; justify-content: space-between;
            cursor: pointer; user-select: none;
        }
        .leaderboard-title {
            font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 2px;
        }
        .toggle-btn {
            width: 28px; height: 28px; border-radius: 50%;
            background: rgba(255,255,255,0.3); border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.3s ease; font-size: 12px; color: #fff;
        }
        .toggle-btn.expanded { transform: rotate(180deg); }
        .leaderboard-body {
            max-height: 0; overflow: hidden; transition: max-height 0.4s ease;
        }
        .leaderboard-body.expanded { max-height: 400px; overflow-y: auto; }
        .leaderboard-body.expanded::-webkit-scrollbar { width: 4px; }
        .leaderboard-body.expanded::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3); border-radius: 2px;
        }
        .leaderboard-content { padding: 12px 16px; min-height: 40px; }
        .empty-tip { color: rgba(255,255,255,0.7); font-size: 14px; letter-spacing: 1px; text-align: center; padding: 20px 0; }

        /* 排行榜条目 */
        .lb-item {
            display: flex; align-items: center;
            padding: 8px 10px; margin-bottom: 6px;
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
            transition: background 0.2s;
        }
        .lb-item:hover { background: rgba(255,255,255,0.25); }
        .lb-rank {
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px; color: #fff;
            background: rgba(255,255,255,0.2); flex-shrink: 0;
        }
        .lb-rank.gold { background: linear-gradient(135deg, #FFD700, #FFA500); box-shadow: 0 0 8px rgba(255,215,0,0.5); }
        .lb-rank.silver { background: linear-gradient(135deg, #C0C0C0, #888); box-shadow: 0 0 8px rgba(192,192,192,0.5); }
        .lb-rank.bronze { background: linear-gradient(135deg, #CD7F32, #8B5A2B); box-shadow: 0 0 8px rgba(205,127,50,0.5); }
        .lb-info { flex: 1; margin-left: 10px; min-width: 0; }
        .lb-score { font-size: 16px; font-weight: 700; color: #fff; }
        .lb-attempt { font-size: 11px; color: rgba(255,255,255,0.65); margin-top: 2px; }

        /* 清空记录按钮 */
        .lb-footer {
            padding: 10px 16px; border-top: 1px solid rgba(255,255,255,0.15);
            text-align: center;
        }
        .lb-clear-btn {
            background: rgba(255,100,100,0.25);
            color: #fff; border: 1px solid rgba(255,100,100,0.4);
            border-radius: 15px; padding: 6px 18px;
            font-size: 12px; cursor: pointer;
            transition: all 0.2s;
        }
        .lb-clear-btn:hover {
            background: rgba(255,100,100,0.4);
            transform: translateY(-1px);
        }

        /* 确认弹窗 */
        #confirmModal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.4); display: none;
            align-items: center; justify-content: center; z-index: 300;
        }
        #confirmModal.visible { display: flex; }
        .confirm-box {
            width: 260px; padding: 30px; border-radius: 20px; text-align: center;
        }
        .confirm-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 16px; }
        .confirm-msg { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 24px; line-height: 1.6; }
        .confirm-btns { display: flex; justify-content: center; gap: 16px; }
        .confirm-btn { padding: 8px 24px; font-size: 14px; }

        /* ========== 结束弹窗 ========== */
        #gameOverModal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.4); display: none;
            align-items: center; justify-content: center; z-index: 200;
        }
        #gameOverModal.visible { display: flex; }
        .modal-content { width: 320px; padding: 40px 30px; border-radius: 24px; text-align: center; }
        .modal-title { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 30px; letter-spacing: 4px; }
        .modal-body { color: rgba(255,255,255,0.8); font-size: 16px; margin-bottom: 30px; min-height: 60px; line-height: 1.8; }
        .modal-btn { margin: 0 10px; padding: 10px 30px; font-size: 16px; }

        /* ========== 挂机按钮 ========== */
        .idle-btn {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px; border-radius: 50%; border: none;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #fff; font-weight: 600; letter-spacing: 1px;
            z-index: 150; transition: all 0.3s ease;
        }
        .idle-btn:hover { transform: scale(1.05); }

        /* ========== 移动端适配 ========== */
        @media (max-width: 768px) {
            .game-title { font-size: 42px; letter-spacing: 4px; }
            .game-subtitle { font-size: 16px; margin-bottom: 40px; }
            .start-btn { font-size: 20px; padding: 14px 50px; }
            #gamePage.active { flex-direction: column; gap: 15px; padding: 15px; }
            .game-area-wrapper { width: 260px; height: 390px; max-width: 80vw; }
            .leaderboard-container { width: 100%; max-width: 320px; }
            .idle-btn { width: 50px; height: 50px; font-size: 12px; bottom: 20px; right: 20px; }
        }
    </style>
</head>
<body>

    <!-- ========== 欢迎页 ========== -->
    <div id="welcomePage">
        <h1 class="game-title">跳一跳</h1>
        <p class="game-subtitle">考验你的精准与节奏</p>
        <button class="btn start-btn" onclick="startGame()">开始游戏</button>
    </div>

    <!-- ========== 游戏主界面 ========== -->
    <div id="gamePage">
        <div class="game-area-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div class="leaderboard-container glass">
            <div class="leaderboard-header" onclick="toggleLeaderboard()">
                <span class="leaderboard-title">排行榜</span>
                <button class="toggle-btn" id="toggleBtn">▼</button>
            </div>
            <div class="leaderboard-body" id="leaderboardBody">
                <div class="leaderboard-content" id="leaderboardContent">
                    <p class="empty-tip">暂无记录</p>
                </div>
                <div class="lb-footer" id="lbFooter" style="display:none;">
                    <button class="lb-clear-btn" onclick="showConfirm()">清空记录</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== 游戏结束弹窗 ========== -->
    <div id="gameOverModal">
        <div class="modal-content glass">
            <h2 class="modal-title">游戏结束</h2>
            <div class="modal-body">
                <p>本局得分：<span id="finalScore">0</span></p>
                <p>最高记录：<span id="bestScore">0</span></p>
            </div>
            <button class="btn modal-btn" onclick="closeModal()">返回首页</button>
            <button class="btn modal-btn" onclick="restartGame()">再来一局</button>
        </div>
    </div>

    <!-- ========== 挂机按钮 ========== -->
    <button class="idle-btn glass" onclick="idleAction()" title="挂机">挂机</button>

    <!-- ========== 确认弹窗 ========== -->
    <div id="confirmModal">
        <div class="confirm-box glass">
            <div class="confirm-title">确认清空</div>
            <div class="confirm-msg">确定要清空所有排行榜记录吗？<br>此操作不可恢复。</div>
            <div class="confirm-btns">
                <button class="btn confirm-btn" onclick="hideConfirm()">取消</button>
                <button class="btn confirm-btn" style="background:rgba(255,100,100,0.4);" onclick="doClearLeaderboard()">确认删除</button>
            </div>
        </div>
    </div>

    <script>
    /* ================================================================
     * 跳一跳 —— 完整游戏逻辑（重写版）
     * 状态机: IDLE → CHARGING → JUMPING → FALLING → IDLE/GAMEOVER
     * 输入: 鼠标、触屏、空格键
     * ================================================================ */

    // ========== 常量 ==========
    const STATE = { IDLE:'idle', CHARGING:'charging', JUMPING:'jumping',
                    FALLING:'falling', GAMEOVER:'gameover' };

    const GRAVITY = 1008;
    const MAX_CHARGE_MS = 1500;

    const MIN_JUMP_DIST = 30;
    // 三档跳跃距离(垂直方向)
    const JUMP_TIERS = [
        { dist: 70,  label: '近' },
        { dist: 140, label: '中' },
        { dist: 210, label: '远' }
    ];
    const MAX_JUMP_DIST = 230;
    const OVERSHOOT = 1.15;

    // 方块宽度随机范围
    const BLOCK_MIN_W = 55;
    const BLOCK_MAX_W = 95;
    const BLOCK_H = 32;

    const BEST_SCORE_KEY = 'tiaoyitiao_best';
    const LB_KEY = 'tiaoyitiao_leaderboard';
    const ATTEMPT_KEY = 'tiaoyitiao_attempt';
    const MAX_LB_ENTRIES = 10;

    // ========== Canvas ==========
    let canvas, ctx;
    let W = 0, H = 0, DPR = 1;
    let animId = null;
    let gameRunning = false;

    // ========== 游戏状态 ==========
    let gameState = STATE.IDLE;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem(BEST_SCORE_KEY) || '0');
    let attemptCount = parseInt(localStorage.getItem(ATTEMPT_KEY) || '0');
    let cameraY = 0;
    let targetCameraY = 0;

    // ========== 云朵 ==========
    let clouds = [];

    // ========== 方块 ==========
    let blocks = [];
    let currentTargetIndex = 1;
    let blockIdCounter = 0;

    // ========== 小人 ==========
    let character = null;

    // ========== 蓄力 ==========
    let chargeStartTime = 0;
    let inputActive = false;
    let touchActive = false;

    // ========== 跳跃物理 ==========
    let jumpStartX = 0, jumpStartY = 0;
    let jumpTargetBlock = null;
    let jumpT = 0;
    let jumpTotalTime = 0;
    let jumpVy0 = 0;

    // ========== 颜色池 ==========
    const BLOCK_COLORS = [
        {top:'#FF9A8B', bottom:'#E76F5C'},
        {top:'#FFD3A5', bottom:'#E8A87C'},
        {top:'#A8E6CF', bottom:'#55B4A0'},
        {top:'#88D8F0', bottom:'#4A90B8'},
        {top:'#C9B6FF', bottom:'#8E7CC3'},
        {top:'#FFAAA5', bottom:'#E07A6F'},
        {top:'#FFEAA7', bottom:'#E0C068'},
        {top:'#98D8C8', bottom:'#4E9A8A'}
    ];

    // ================================================================
    // Canvas 初始化
    // ================================================================
    function initCanvas() {
        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');
        resizeCanvas();
        window.addEventListener('resize', () => {
            if (canvas) resizeCanvas();
        });
        bindInputEvents();
    }

    function resizeCanvas() {
        if (!canvas) return;
        const r = canvas.parentElement.getBoundingClientRect();
        DPR = window.devicePixelRatio || 1;
        W = Math.floor(r.width);
        H = Math.floor(r.height);
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    // ================================================================
    // 输入事件绑定
    // ================================================================
    function bindInputEvents() {
        // 鼠标
        canvas.addEventListener('mousedown', function(){
            if (touchActive) return;
            onInputDown();
        });
        document.addEventListener('mouseup', function(){
            if (touchActive) return;
            onInputUp();
        });
        // 触屏
        canvas.addEventListener('touchstart', function(e){ 
            e.preventDefault(); 
            touchActive = true;
            onInputDown(); 
        }, {passive:false});
        canvas.addEventListener('touchend', function(e){ 
            e.preventDefault(); 
            onInputUp();
            touchActive = false;
        }, {passive:false});
        canvas.addEventListener('touchcancel', function(){
            onInputUp();
            touchActive = false;
        });
        // 键盘空格
        let spaceDown = false;
        let spaceLastTime = 0;
        document.addEventListener('keydown', function(e){
            if(e.code === 'Space' && !spaceDown){
                const now = performance.now();
                if (now - spaceLastTime < 50) return;
                e.preventDefault();
                spaceDown = true;
                spaceLastTime = now;
                onInputDown();
            }
        });
        document.addEventListener('keyup', function(e){
            if(e.code === 'Space'){
                e.preventDefault();
                spaceDown = false;
                onInputUp();
            }
        });
        // 窗口失焦时, 强制释放
        window.addEventListener('blur', function(){
            if (inputActive) {
                spaceDown = false;
                touchActive = false;
                onInputUp();
            }
        });
    }

    let chargeTimeoutId = null;
    let safetyTimeoutId = null;

    function onInputDown() {
        if (!gameRunning) return;
        if (gameState !== STATE.IDLE) return;
        if (inputActive) return;
        inputActive = true;
        gameState = STATE.CHARGING;
        chargeStartTime = performance.now();
        if (character) { character.squash = 0; character.stretch = 0; }
        if (chargeTimeoutId) { clearTimeout(chargeTimeoutId); chargeTimeoutId = null; }
        if (safetyTimeoutId) { clearTimeout(safetyTimeoutId); safetyTimeoutId = null; }
        safetyTimeoutId = setTimeout(function() {
            if (gameState === STATE.CHARGING) {
                onInputUp();
            }
        }, MAX_CHARGE_MS + 200);
    }

    function onInputUp() {
        if (!gameRunning) return;
        if (gameState !== STATE.CHARGING) return;
        inputActive = false;
        if (safetyTimeoutId) { clearTimeout(safetyTimeoutId); safetyTimeoutId = null; }
        const elapsed = Math.min(performance.now() - chargeStartTime, MAX_CHARGE_MS);
        const power = elapsed / MAX_CHARGE_MS;
        launchJump(power);
    }

    // ================================================================
    // 场景初始化
    // ================================================================
    function initScene() {
        score = 0;
        gameState = STATE.IDLE;
        blockIdCounter = 0;
        jumpTargetBlock = null;
        jumpT = 0;

        initClouds();
        initBlocks();
        initCharacter();
        
        // 初始化相机到角色位置
        cameraY = character.wy - H * 0.70;
        targetCameraY = cameraY;
        
        updateHUD();
    }

    // ================================================================
    // 云朵
    // ================================================================
    function initClouds() {
        clouds = [];
        for (let i = 0; i < 5; i++) {
            clouds.push({
                x: Math.random() * W,
                y: 15 + Math.random() * (H * 0.3),
                w: 40 + Math.random() * 40,
                h: 15 + Math.random() * 15,
                vx: 0.12 + Math.random() * 0.18,
                alpha: 0.4 + Math.random() * 0.3
            });
        }
    }

    function drawClouds() {
        clouds.forEach(c => {
            ctx.save();
            ctx.globalAlpha = c.alpha;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(c.x, c.y, c.w*0.5, c.h*0.5, 0, 0, Math.PI*2);
            ctx.ellipse(c.x-c.w*0.3, c.y+5, c.w*0.35, c.h*0.4, 0, 0, Math.PI*2);
            ctx.ellipse(c.x+c.w*0.3, c.y+3, c.w*0.4, c.h*0.45, 0, 0, Math.PI*2);
            ctx.ellipse(c.x+c.w*0.1, c.y-c.h*0.3, c.w*0.35, c.h*0.35, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        });
    }

    function updateClouds() {
        clouds.forEach(c => {
            c.x += c.vx;
            if (c.x - c.w > W) c.x = -c.w;
        });
    }

    // ================================================================
    // 方块系统
    // ================================================================
    function initBlocks() {
        blocks = [];
        const centerX = W / 2;
        const firstW = 75;
        const baseY = H * 0.75;
        // 第一个方块(角色站立) - 放在画面下方中央
        const first = createBlock(centerX - firstW/2, baseY, firstW);
        blocks.push(first);
        // 预生成6个方块 - 向上排列
        for (let i = 0; i < 6; i++) {
            addNextBlock();
        }
        currentTargetIndex = 1;
    }

    function createBlock(x, y, w) {
        const color = BLOCK_COLORS[Math.floor(Math.random() * BLOCK_COLORS.length)];
        return {
            id: ++blockIdCounter,
            x: x, y: y,
            width: w, height: BLOCK_H,
            colorTop: color.top,
            colorBottom: color.bottom,
            fading: false,
            fadeAlpha: 1
        };
    }

    function addNextBlock() {
        const prev = blocks[blocks.length - 1];
        const tier = JUMP_TIERS[Math.floor(Math.random() * JUMP_TIERS.length)];
        const nextW = BLOCK_MIN_W + Math.random() * (BLOCK_MAX_W - BLOCK_MIN_W);
        const landingX = character ? character.wx : (blocks[0].x + blocks[0].width / 2);
        const newX = landingX - nextW / 2;
        const newY = prev.y - tier.dist;
        blocks.push(createBlock(newX, newY, nextW));
    }

    function drawBlocks() {
        blocks.forEach(b => {
            ctx.save();
            ctx.globalAlpha = b.fadeAlpha;

            // 地面影子
            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            ctx.beginPath();
            ctx.ellipse(b.x + b.width/2, b.y + b.height + 6, b.width*0.42, 5, 0, 0, Math.PI*2);
            ctx.fill();

            // 方块渐变(上亮下暗)
            const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.height);
            g.addColorStop(0, b.colorTop);
            g.addColorStop(1, b.colorBottom);
            ctx.fillStyle = g;
            roundRect(b.x, b.y, b.width, b.height, 8);
            ctx.fill();

            // 顶部高光
            ctx.globalAlpha = b.fadeAlpha * 0.25;
            ctx.fillStyle = '#fff';
            roundRect(b.x + 5, b.y + 1, b.width - 10, 4, 2);
            ctx.fill();

            // 目标标记闪烁
            if (blocks[currentTargetIndex] && b.id === blocks[currentTargetIndex].id
                && (gameState === STATE.IDLE || gameState === STATE.CHARGING)) {
                const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 280);
                ctx.globalAlpha = b.fadeAlpha * pulse;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.moveTo(b.x + b.width/2, b.y - 20);
                ctx.lineTo(b.x + b.width/2 - 9, b.y - 8);
                ctx.lineTo(b.x + b.width/2 + 9, b.y - 8);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();
        });
    }

    function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x+r, y);
        ctx.lineTo(x+w-r, y);
        ctx.quadraticCurveTo(x+w, y, x+w, y+r);
        ctx.lineTo(x+w, y+h-r);
        ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
        ctx.lineTo(x+r, y+h);
        ctx.quadraticCurveTo(x, y+h, x, y+h-r);
        ctx.lineTo(x, y+r);
        ctx.quadraticCurveTo(x, y, x+r, y);
        ctx.closePath();
    }

    // ================================================================
    // 小人
    // ================================================================
    function initCharacter() {
        const b = blocks[0];
        character = {
            wx: b.x + b.width / 2,
            wy: b.y,
            headR: 18,
            bodyW: 26,
            bodyH: 46,
            legH: 16,
            color: '#4A5568',
            headColor: '#F5D0A9',
            squash: 0,
            stretch: 0
        };
    }

    function drawCharacter() {
        if (!character) return;
        const c = character;
        const sq = c.squash;
        const st = c.stretch;

        // 压缩/拉伸变形计算
        const effLegH = c.legH * (1 - sq*0.5 + st*0.3);
        const effBodyH = c.bodyH * (1 - sq*0.4 + st*0.25);
        const effHeadR = c.headR * (1 - sq*0.1 + st*0.15);
        const offsetY = sq * 8 - st * 5;

        const feetY = c.wy + offsetY;
        const bodyBottomY = feetY - effLegH;
        const bodyTopY = bodyBottomY - effBodyH;
        const headCY = bodyTopY - effHeadR + 2;

        ctx.save();

        // 影子
        const shadowScale = 1 - sq * 0.3;
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.ellipse(c.wx, feetY + 3, 18*shadowScale, 5*shadowScale, 0, 0, Math.PI*2);
        ctx.fill();

        // 腿
        ctx.fillStyle = c.color;
        ctx.fillRect(c.wx - 9, bodyBottomY, 7, effLegH);
        ctx.fillRect(c.wx + 2, bodyBottomY, 7, effLegH);

        // 身体
        const bw = c.bodyW, bh = effBodyH, bx = c.wx - bw/2, by = bodyTopY;
        ctx.fillStyle = c.color;
        roundRect(bx, by, bw, bh, 6);
        ctx.fill();

        // 手臂
        ctx.fillRect(bx - 5, by + 6, 5, bh * 0.55);
        ctx.fillRect(bx + bw, by + 6, 5, bh * 0.55);

        // 头
        ctx.fillStyle = c.headColor;
        ctx.beginPath();
        ctx.arc(c.wx, headCY, effHeadR, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.12)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 眼睛
        ctx.fillStyle = '#2D3748';
        ctx.beginPath();
        ctx.arc(c.wx - 6, headCY - 3, 2, 0, Math.PI*2);
        ctx.arc(c.wx + 6, headCY - 3, 2, 0, Math.PI*2);
        ctx.fill();

        // 嘴巴
        ctx.strokeStyle = '#2D3748';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.arc(c.wx, headCY + 4, 3.5, 0, Math.PI);
        ctx.stroke();

        ctx.restore();
    }

    // ================================================================
    // 跳跃物理 (垂直向上跳)
    // ================================================================
    function launchJump(power) {
        if (!character) return;
        const target = blocks[currentTargetIndex];
        if (!target) return;

        // 蓄力 → 垂直跳跃距离
        const jumpDist = MIN_JUMP_DIST + power * (MAX_JUMP_DIST - MIN_JUMP_DIST);
        const d = Math.max(20, jumpDist);

        // 向上跳: 目标方块在上方, 角色需要跳到目标高度再落回来
        // 峰值高度 = d * OVERSHOOT (越过目标再回来)
        const peakH = d * OVERSHOOT;
        jumpVy0 = Math.sqrt(2 * GRAVITY * peakH);

        // 求解飞行时间: d = v0*T - 0.5*g*T^2
        // → 0.5*g*T^2 - v0*T + d = 0
        const a = 0.5 * GRAVITY;
        const b = -jumpVy0;
        const c = d;
        const discriminant = b * b - 4 * a * c;
        if (discriminant < 0) return;
        // 取较大根(下落阶段落地)
        jumpTotalTime = (-b + Math.sqrt(discriminant)) / (2 * a);

        jumpStartX = character.wx;
        jumpStartY = character.wy;
        jumpT = 0;
        jumpTargetBlock = target;

        gameState = STATE.JUMPING;
        // 蓄力回弹
        character.squash = 0;
        character.stretch = 1;
    }

    function updateJump(dt) {
        if (gameState !== STATE.JUMPING && gameState !== STATE.FALLING) return;
        jumpT += dt;

        // 垂直跳跃抛物线
        character.wy = jumpStartY - jumpVy0 * jumpT + 0.5 * GRAVITY * jumpT * jumpT;

        // 切换到下落状态
        const curVy = -jumpVy0 + GRAVITY * jumpT;
        if (curVy >= 0 && gameState === STATE.JUMPING) {
            gameState = STATE.FALLING;
        }

        // 拉伸衰减
        character.stretch *= 0.88;
        if (character.stretch < 0.01) character.stretch = 0;

        const target = jumpTargetBlock;

        if (jumpT >= jumpTotalTime) {
            if (target) {
                character.wx = target.x + target.width / 2;
                character.wy = target.y;
                jumpTargetBlock = null;
                onSuccessfulLanding();
                return;
            }
            return;
        }

        if (target && gameState === STATE.FALLING) {
            if (character.wy >= target.y) {
                character.wx = target.x + target.width / 2;
                character.wy = target.y;
                jumpTargetBlock = null;
                onSuccessfulLanding();
                return;
            }
        }

        // 掉出屏幕
        if (character.wy > H + 120) {
            gameOver();
        }
    }

    function onSuccessfulLanding() {
        score++;
        updateHUD();

        for (let i = 0; i < currentTargetIndex; i++) {
            if (blocks[i]) blocks[i].fading = true;
        }

        currentTargetIndex++;

        while (blocks.length - currentTargetIndex < 4) {
            addNextBlock();
        }

        gameState = STATE.IDLE;
        character.stretch = 0;
        character.squash = 0;
        inputActive = false;
        jumpT = 0;
        jumpTargetBlock = null;
    }

    // ================================================================
    // 相机跟随 (垂直方向)
    // ================================================================
    function updateCamera() {
        targetCameraY = character.wy - H * 0.70;
        
        // 只有跳跃中才平滑跟随
        if (gameState === STATE.JUMPING || gameState === STATE.FALLING) {
            cameraY += (targetCameraY - cameraY) * 0.15;
        }
        // 静止/蓄力/游戏结束时, 相机绝对锁定, 不漂移
    }

    // ================================================================
    // HUD
    // ================================================================
    function updateHUD() {
        const el = document.getElementById('finalScore');
        if (el) el.textContent = score;
        const bs = document.getElementById('bestScore');
        if (bs) bs.textContent = bestScore;
    }

    function drawHUD() {
        ctx.save();

        // 左上角分数
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.font = 'bold 22px "PingFang SC", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('分数: ' + score, 16, 32);

        // 蓄力中: 白色蓄力条
        if (gameState === STATE.CHARGING) {
            const elapsed = Math.min(performance.now() - chargeStartTime, MAX_CHARGE_MS);
            const power = elapsed / MAX_CHARGE_MS;
            const barW = Math.min(W * 0.6, 240);
            const barH = 8;
            const barX = (W - barW) / 2;
            const barY = H - 30;

            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            roundRect(barX, barY, barW, barH, 4);
            ctx.fill();

            ctx.fillStyle = '#fff';
            roundRect(barX, barY, Math.max(2, barW * power), barH, 4);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.font = '13px "PingFang SC", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('蓄力中...', W/2, H - 45);
        }

        // 操作提示(首次游戏)
        if (score < 1 && gameState === STATE.IDLE) {
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.font = '14px "PingFang SC", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('按住 屏幕/鼠标/空格键 蓄力, 松开上跳', W/2, 55);
            ctx.font = '12px "PingFang SC", sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.65)';
            ctx.fillText('近 70 · 中 140 · 远 210', W/2, 78);
        }

        ctx.restore();
    }

    // ================================================================
    // 游戏结束
    // ================================================================
    function gameOver() {
        if (gameState === STATE.GAMEOVER) return;
        gameState = STATE.GAMEOVER;
        gameRunning = false;
        inputActive = false;
        if (animId) { cancelAnimationFrame(animId); animId = null; }
        if (safetyTimeoutId) { clearTimeout(safetyTimeoutId); safetyTimeoutId = null; }
        if (chargeTimeoutId) { clearTimeout(chargeTimeoutId); chargeTimeoutId = null; }

        if (character) {
            character.wy = H + 100;
        }

        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem(BEST_SCORE_KEY, bestScore);
        }

        saveScore(score);

        setTimeout(() => {
            updateHUD();
            document.getElementById('finalScore').textContent = score;
            document.getElementById('bestScore').textContent = bestScore;
            document.getElementById('gameOverModal').classList.add('visible');
        }, 500);
    }

    // ================================================================
    // 主循环
    // ================================================================
    let lastTime = 0;
    function gameLoop(now) {
        if (!gameRunning) return;
        if (!lastTime) lastTime = now;
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        // 更新
        updateClouds();

        if (gameState === STATE.CHARGING) {
            const elapsed = Math.min(now - chargeStartTime, MAX_CHARGE_MS);
            character.squash = elapsed / MAX_CHARGE_MS;
            // 蓄力越久, 身体越扁
            character.stretch = 0;
        }

        if (gameState === STATE.JUMPING || gameState === STATE.FALLING) {
            updateJump(dt);
        }

        // 相机跟随
        if (character) updateCamera();

        // 淡出方块
        blocks.forEach(b => { if (b.fading) b.fadeAlpha -= 0.02; });
        blocks = blocks.filter(b => {
            if (b.fadeAlpha <= 0) return false;
            // 方块在相机下方太远则移除
            if (b.y > cameraY + H + 200) return false;
            return true;
        });

        // 保持currentTargetIndex有效
        if (currentTargetIndex >= blocks.length) {
            currentTargetIndex = Math.max(0, blocks.length - 1);
        }

        // 清空画布
        ctx.clearRect(0, 0, W, H);

        // 世界坐标绘制(相机垂直偏移)
        ctx.save();
        ctx.translate(0, -cameraY);
        drawBlocks();
        drawCharacter();
        ctx.restore();

        // 屏幕坐标绘制
        drawClouds();
        drawHUD();

        animId = requestAnimationFrame(gameLoop);
    }

    // ================================================================
    // 页面交互
    // ================================================================
    function startGame() {
        const wp = document.getElementById('welcomePage');
        const gp = document.getElementById('gamePage');
        wp.classList.add('hidden');
        setTimeout(() => {
            wp.style.display = 'none';
            gp.classList.add('active');
            if (!canvas) initCanvas();
            else resizeCanvas();
            initScene();
            gameRunning = true;
            lastTime = 0;
            if (animId) cancelAnimationFrame(animId);
            animId = requestAnimationFrame(gameLoop);
        }, 500);
    }

    function toggleLeaderboard() {
        document.getElementById('leaderboardBody').classList.toggle('expanded');
        document.getElementById('toggleBtn').classList.toggle('expanded');
    }

    function closeModal() {
        document.getElementById('gameOverModal').classList.remove('visible');
        gameRunning = false;
        if (animId) { cancelAnimationFrame(animId); animId = null; }
        if (safetyTimeoutId) { clearTimeout(safetyTimeoutId); safetyTimeoutId = null; }
        if (chargeTimeoutId) { clearTimeout(chargeTimeoutId); chargeTimeoutId = null; }
        gameState = STATE.IDLE;
        inputActive = false;
        touchActive = false;
        jumpT = 0;
        document.getElementById('gamePage').classList.remove('active');
        const wp = document.getElementById('welcomePage');
        wp.style.display = 'flex';
        wp.classList.remove('hidden');
    }

    function restartGame() {
        document.getElementById('gameOverModal').classList.remove('visible');
        initScene();
        gameState = STATE.IDLE;
        gameRunning = true;
        inputActive = false;
        touchActive = false;
        lastTime = 0;
        jumpT = 0;
        if (safetyTimeoutId) { clearTimeout(safetyTimeoutId); safetyTimeoutId = null; }
        if (chargeTimeoutId) { clearTimeout(chargeTimeoutId); chargeTimeoutId = null; }
        if (animId) cancelAnimationFrame(animId);
        animId = requestAnimationFrame(gameLoop);
    }

    function idleAction() {
        console.log('挂机');
    }

    // ================================================================
    // 排行榜
    // ================================================================
    function loadScores() {
        try {
            const raw = localStorage.getItem(LB_KEY);
            if (!raw) return [];
            const arr = JSON.parse(raw);
            return Array.isArray(arr) ? arr : [];
        } catch(e) { return []; }
    }

    function saveScore(scoreVal) {
        attemptCount++;
        localStorage.setItem(ATTEMPT_KEY, attemptCount);
        const list = loadScores();
        list.push({ score: scoreVal, attempt: attemptCount });
        list.sort((a, b) => b.score - a.score);
        if (list.length > MAX_LB_ENTRIES) list.length = MAX_LB_ENTRIES;
        localStorage.setItem(LB_KEY, JSON.stringify(list));
        renderLeaderboard();
    }

    function renderLeaderboard() {
        const list = loadScores();
        const container = document.getElementById('leaderboardContent');
        const footer = document.getElementById('lbFooter');

        if (list.length === 0) {
            container.innerHTML = '<p class="empty-tip">暂无记录</p>';
            footer.style.display = 'none';
            return;
        }

        footer.style.display = 'block';
        const top = list.slice(0, MAX_LB_ENTRIES);
        let html = '';
        top.forEach((item, idx) => {
            const rank = idx + 1;
            let rankClass = '';
            let rankIcon = rank;
            if (rank === 1) { rankClass = 'gold'; rankIcon = '🥇'; }
            else if (rank === 2) { rankClass = 'silver'; rankIcon = '🥈'; }
            else if (rank === 3) { rankClass = 'bronze'; rankIcon = '🥉'; }

            html += `
                <div class="lb-item">
                    <div class="lb-rank ${rankClass}">${rank <= 3 ? rankIcon : rank}</div>
                    <div class="lb-info">
                        <div class="lb-score">${item.score} 分</div>
                        <div class="lb-attempt">第 ${item.attempt} 次挑战</div>
                    </div>
                </div>`;
        });
        container.innerHTML = html;
    }

    function showConfirm() {
        document.getElementById('confirmModal').classList.add('visible');
    }
    function hideConfirm() {
        document.getElementById('confirmModal').classList.remove('visible');
    }
    function doClearLeaderboard() {
        localStorage.removeItem(LB_KEY);
        localStorage.removeItem(ATTEMPT_KEY);
        attemptCount = 0;
        hideConfirm();
        renderLeaderboard();
    }

    // 页面加载初始化
    window.addEventListener('DOMContentLoaded', function() {
        renderLeaderboard();
    });
    </script>
</body>
</html>
